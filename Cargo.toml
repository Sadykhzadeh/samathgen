[package]
name = "samathgen"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
description = "Generates math expressions for education purposes"
license = "GPL-3.0-or-later"
repository = "https://got.az/azer/samathgen"
readme = "README.md"
keywords = ["math", "generator", "education", "expression"]
categories = ["mathematics", "wasm"]

[lib]
# cdylib for the wasm artefact, rlib so `cargo test` can exercise the core
# natively without a browser or Node in the way.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
